<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidebound — Overlay</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23FFD166'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      html.tb-portrait-page, html.tb-portrait-page body { width: 1080px; height: 1920px; }
      #stage { position: relative; width: 1920px; height: 1080px; }
      html.tb-portrait-page #stage { width: 1080px; height: 1920px; }
      #game { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      html.tb-portrait-page #game { width: 1080px; height: 1920px; }
      #game canvas { width: 1920px !important; height: 1080px !important; margin: 0 !important; display: block; }
      html.tb-portrait-page #game canvas { width: 1080px !important; height: 1920px !important; }
      #hud { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; }
      html.tb-portrait-page #hud { width: 1080px; height: 1920px; }
      /* T4F-B renderer connection notice: text state, never color-alone.
         Hidden while live so the broadcast frame stays clean; ?debug=1
         keeps it visible for verification. */
      #renderer-status { position: absolute; left: 12px; bottom: 10px; z-index: 5; padding: 6px 14px; border-radius: 16px; font: 600 14px/1.4 system-ui, sans-serif; color: #f4efe4; background: rgba(23, 18, 40, 0.85); border: 1px solid #3d2b63; }
      #renderer-status[data-s="live"] { background: rgba(29, 92, 63, 0.9); }
      #renderer-status[data-s="live"]:not([data-debug="1"]) { display: none; }
      #renderer-status[data-s="down"] { background: rgba(107, 29, 29, 0.9); }
    </style>
  </head>
  <body>
    <div id="stage" role="img" aria-label="Tidebound living story overlay">
      <div id="game"></div>
      <div id="hud" aria-live="polite"></div>
      <div id="renderer-status" role="status" data-s="waiting">Waiting — starting…</div>
    </div>
    <script>
      // T4C format selection: `?format=portrait` switches the OBS stage to
      // 1080×1920. The module script below boots the matching game size.
      try {
        if (new URLSearchParams(location.search).get("format") === "portrait") {
          document.documentElement.classList.add("tb-portrait-page");
        }
      } catch { /* default landscape stage */ }
    </script>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
